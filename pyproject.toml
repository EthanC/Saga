[project]
name = "saga"
version = "0.1.0"
description = "Preserve YouTube channels and report new uploads to Discord."
readme = "README.md"
requires-python = ">=3.15"
license = "AGPL-3.0-only"
authors = [{ name = "EthanC", email = "16727756+EthanC@users.noreply.github.com" }]
dependencies = [
  "archivist-py==1.4.0",
  "bgutil-ytdlp-pot-provider==2.0.2",
  "cronsim>=2.7",
  "discord-clyde>=1.2.0",
  "environs>=15.2.0",
  "filelock>=4.1.1",
  "loguru>=0.7.3",
  "loguru-discord>=2.2.0",
  "niquests>=3.21.2",
  "sqlmodel>=0.0.48",
  "tzdata>=2026.5",
  "tzlocal>=5.4.4",
  "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
  "coverage>=7.16.2",
  "jsonschema>=4.26.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.0",
  "ty>=0.0.86",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.uv]
no-binary-package = ["urllib3-future"]
extra-build-variables = { "urllib3-future" = { URLLIB3_NO_OVERRIDE = "1" } }

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["core"]
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = []

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
