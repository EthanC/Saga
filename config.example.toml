#:schema https://raw.githubusercontent.com/EthanC/Saga/main/config.schema.json

[instances]

[[instances.youtube]]
name = "example"
cooldown = 60
retries = 3
retry_delay = 5
reconciliation_interval = 21600

[[instances.youtube.channels]]
reference = "@ExampleHandle"
videos = true
shorts = true
livestreams = true
discord_webhook_urls = [
  "https://discord.com/api/webhooks/000000000000000000/example-token",
]

[[instances.youtube.channels]]
reference = "https://www.youtube.com/channel/UCxxxxxxxxxxxxxxxxxxxxxx"
videos = true
shorts = true
livestreams = true
discord_webhook_urls = [
  "https://discord.com/api/webhooks/111111111111111111/another-token",
]
