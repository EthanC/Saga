[project]
name = "saga"
version = "0.1.0"
description = "Preserve YouTube channels and report new uploads to Discord."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
authors = [{ name = "EthanC", email = "16727756+EthanC@users.noreply.github.com" }]
dependencies = [
  "archivist-py>=1.3.0",
  "bgutil-ytdlp-pot-provider==2.0.0",
  "cronsim>=2.7",
  "discord-clyde>=1.1.0",
  "environs>=15.2.0",
  "filelock>=3.20.3",
  "loguru>=0.7.3",
  "loguru-discord>=2.1.0",
  "niquests>=3.21.2",
  "sqlmodel>=0.0.27",
  "tzdata>=2026.4",
  "tzlocal>=5.4.4",
  "yt-dlp[default]>=2025.11.12",
]

[dependency-groups]
dev = [
  "coverage>=7.10.7",
  "jsonschema>=4.26.0",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.16.7",
  "ty>=0.0.81",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["core"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = []

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
