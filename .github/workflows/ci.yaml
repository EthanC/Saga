name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: >-
          uv run pytest
          --cov=core
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=100
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
      - uses: docker/build-push-action@v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image namespaces and unprivileged startup
        if: github.event_name == 'push'
        run: |
          docker run --rm --user 1000:1000 --entrypoint python -e PYTHONPATH=/app -v "$PWD/.github:/smoke:ro" "ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" /smoke/smoke_image.py
          docker run --rm -e PUID=1234 -e PGID=2345 -e PYTHONPATH=/app -v "$PWD/.github:/smoke:ro" "ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" python /smoke/smoke_cache.py
